<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#062814">
<meta name="apple-mobile-web-app-title" content="DominEA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>DominEA — 4-Player Partners</title>
<style>
  html{height:100%;background:#062814}
  body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
       background:#0b3d20;font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden;
       touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
       overscroll-behavior:none;-webkit-text-size-adjust:100%}
  #top{flex:0 0 auto;min-height:48px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 16px;background:#062814;box-sizing:border-box;gap:6px 12px}
  #scores{font-size:15px;white-space:nowrap}
  #scores b{color:#ffd35c}
  #status{font-size:16px;text-align:center;flex:1}
  #btns{white-space:nowrap}
  #wrap{flex:1 1 auto;position:relative;min-height:0}
  #game{position:absolute;left:0;top:0;display:block;touch-action:manipulation}
  .short{display:none}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10}
  #panel{background:#f4efe1;color:#222;padding:22px 32px;border-radius:10px;max-width:min(580px,92vw);max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
  #panel h1,#panel h2{margin:6px 0 12px}
  #panel ul{text-align:left;line-height:1.5;padding-left:20px}
  #panel table{margin:8px auto;border-collapse:collapse}
  #panel td{padding:2px 12px}
  button{font-size:16px;padding:8px 18px;border-radius:6px;border:none;background:#e0ad45;color:#222;cursor:pointer;margin:6px;font-weight:600;touch-action:manipulation}
  @media (hover:hover){button:hover{background:#f2c35f}}
  button:active{background:#f2c35f}
  #top button{font-size:13px;padding:6px 12px;margin:0}
  #choice{position:fixed;display:none;left:50%;transform:translateX(-50%);bottom:150px;background:rgba(0,0,0,.8);padding:8px 12px;border-radius:10px;z-index:5;white-space:nowrap}
  .menu button{display:block;width:230px;max-width:100%;margin:12px auto;font-size:19px;padding:13px 18px}
  .menu .sub{opacity:.7;margin:-4px 0 14px}
  .menu .credits{margin:18px 0 2px;font-size:14px;opacity:.65;font-style:italic}
  .setting{display:flex;align-items:center;justify-content:space-between;gap:24px;width:260px;max-width:100%;margin:14px auto;font-size:18px;text-align:left}
  .setting span{white-space:nowrap}
  .menu .setting button{display:inline-block;width:auto;flex:0 0 auto;margin:0;min-width:84px;font-size:17px;padding:10px 16px}
  .setting button.off{background:#bbb}
  @media (max-width:700px){
    #top{padding:6px 10px;gap:4px 8px}
    #scores{font-size:14px;order:1}
    #btns{order:2}
    #status{order:3;flex-basis:100%;font-size:14px;min-height:18px}
    .long{display:none} .short{display:inline}
    #panel{padding:14px 16px;font-size:14px}
    #panel ul{padding-left:16px;line-height:1.4}
    #panel h1{font-size:24px} #panel h2{font-size:19px}
    #choice{padding:6px}
    #choice button{font-size:15px;padding:12px 12px;margin:3px}
  }
</style>
</head>
<body>
<div id="top">
  <div id="scores"></div>
  <div id="status"></div>
  <div id="btns"><button onclick="showRules()">Rules</button> <button onclick="showMenu()">Menu</button></div>
</div>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="choice">
  <button id="chooseL"></button>
  <button id="chooseR"></button>
  <button onclick="cancelChoice()">Cancel</button>
</div>
<div id="overlay"><div id="panel"></div></div>

<script>
// ===================== CONSTANTS & STATE =====================
const NAMES = ['You', 'East', 'North', 'West'];        // seat 0 bottom, 1 right, 2 top, 3 left (play goes counter-clockwise)
const TEAM_NAMES = ['You & North', 'East & West'];      // team = seat % 2
const TARGET = 100;
const BOT_DELAY = 1000;    // ms a bot "thinks" before it plays or passes
const ANIM_MS = 400;       // ms for a played tile to slide onto the board

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

let hands = [[], [], [], []];
let board = null;          // {center:{a,b}, left:[{inner,outer}], right:[{inner,outer}]}
let lastPlaced = null;
let scores = [0, 0];
let turn = 0, handNo = 0, handLeader = 0, nextLeader = 0;
let mustLead66 = false;
let lacks = [];            // lacks[p] = Set of numbers player p is known not to have (from passes)
let lastAct = ['', '', '', ''];
let phase = 'start';       // start | play | over | matchover
let revealed = false;
let gen = 0;               // invalidates stale timers
let handHits = [];
let pending = null;        // tile awaiting left/right choice
let hoverIdx = -1;
let anim = null;           // {from:{x,y}, start} – tile sliding onto the board
let paused = false;        // true while the menu / rules are open during a hand
let resumeFn = null;       // action that was due while paused
let lastResultHtml = '';   // end-of-hand summary, so it can be re-shown after the menu

// ===================== SETTINGS & SOUND =====================
const settings = { sound: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem('dominoSettings') || '{}')); } catch (e) {}
function saveSettings() { try { localStorage.setItem('dominoSettings', JSON.stringify(settings)); } catch (e) {} }

let AC = null, noiseBuf = null;
function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
// Phones only allow sound after the user touches the screen, so unlock audio on the first tap.
document.addEventListener('pointerdown', () => { if (settings.sound) audio(); }, { once: true });

// Tile "clack": a short filtered noise burst plus a little wooden thump. Synthesized, so no sound files needed.
function sfxClack() {
  if (!settings.sound) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  if (!noiseBuf) {
    const len = Math.floor(ac.sampleRate * 0.06);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  }
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2000 + Math.random() * 700; bp.Q.value = 1.3;
  const g = ac.createGain(); g.gain.value = 0.8;
  src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t);
  const o = ac.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.05);
  const og = ac.createGain(); og.gain.setValueAtTime(0.3, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + 0.1);
}
// Pass: a soft, low double knock on the table.
function sfxPass() {
  if (!settings.sound) return;
  const ac = audio(); if (!ac) return;
  for (const dt of [0, 0.12]) {
    const t = ac.currentTime + dt;
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.08);
    const g = ac.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.12);
  }
}

// Run fn after ms, unless the hand changed; if the game is paused, hold it until resume.
function later(fn, ms) {
  const g = gen;
  setTimeout(() => {
    if (g !== gen || phase !== 'play') return;
    if (paused) resumeFn = fn; else fn();
  }, ms);
}

// ===================== RULES / GAME LOGIC =====================
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pipsOf(p) { return hands[p].reduce((s, t) => s + t[0] + t[1], 0); }
const has = (t, n) => t[0] === n || t[1] === n;

function ends() {
  const L = board.left.length ? board.left[board.left.length - 1].outer : board.center.a;
  const R = board.right.length ? board.right[board.right.length - 1].outer : board.center.b;
  return [L, R];
}

function boardTiles() {
  if (!board) return [];
  const r = [[board.center.a, board.center.b]];
  for (const e of board.left) r.push([e.inner, e.outer]);
  for (const e of board.right) r.push([e.inner, e.outer]);
  return r;
}

function legalMoves(p) {
  const res = [];
  if (!board) {
    for (const t of hands[p]) {
      if (mustLead66 && !(t[0] === 6 && t[1] === 6)) continue;
      res.push({ t, side: 'C' });
    }
    return res;
  }
  const [L, R] = ends();
  for (const t of hands[p]) {
    if (has(t, L)) res.push({ t, side: 'L' });
    if (has(t, R)) res.push({ t, side: 'R' });
  }
  return res;
}

function newMatch() {
  scores = [0, 0]; handNo = 0;
  newHand();
}

function newHand() {
  gen++;
  const tiles = [];
  for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) tiles.push([a, b]);
  shuffle(tiles);
  hands = [0, 1, 2, 3].map(i => tiles.slice(i * 7, i * 7 + 7));
  hands[0].sort((x, y) => (x[0] - y[0]) || (x[1] - y[1]));
  board = null; lastPlaced = null;
  lacks = [0, 1, 2, 3].map(() => new Set());
  lastAct = ['', '', '', ''];
  revealed = false; pending = null; hideChoice();
  anim = null; paused = false; resumeFn = null;
  if (handNo === 0) {
    turn = hands.findIndex(h => h.some(t => t[0] === 6 && t[1] === 6));
    mustLead66 = true;
  } else {
    turn = nextLeader;
    mustLead66 = false;
  }
  handLeader = turn;
  handNo++;
  phase = 'play';
  hideOverlay();
  updateHeader();
  step();
}

function seatCenter(q) {
  const Lo = getLayout();
  if (q === 0) return { x: W / 2, y: H - Lo.handH / 2 };
  if (Lo.compact) { const colW = W / 3, k = { 3: 0, 2: 1, 1: 2 }[q]; return { x: colW * k + colW / 2, y: 48 }; }
  if (q === 2) return { x: W / 2, y: 60 };
  return { x: q === 1 ? W - Lo.sideW / 2 : Lo.sideW / 2, y: Lo.topH + (H - Lo.topH - Lo.handH) / 2 };
}

function startAnim(from) {
  anim = { from, start: performance.now() };
  const loop = () => {
    if (!anim) return;
    if (performance.now() - anim.start >= ANIM_MS) { anim = null; sfxClack(); render(); return; }
    render();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function doPlay(p, t, side) {
  const idx = hands[p].indexOf(t);
  let from = seatCenter(p);
  if (p === 0) { const h = handHits.find(h => h.i === idx); if (h) from = { x: h.x + h.w / 2, y: h.y + h.h / 2 }; }
  hands[p].splice(idx, 1);
  if (side === 'C') {
    board = { center: { a: t[0], b: t[1] }, left: [], right: [] };
    lastPlaced = board.center;
    mustLead66 = false;
  } else {
    const [L, R] = ends();
    const e = side === 'L' ? L : R;
    const outer = t[0] === e ? t[1] : t[0];
    const entry = { inner: e, outer };
    (side === 'L' ? board.left : board.right).push(entry);
    lastPlaced = entry;
  }
  lastAct[p] = `played ${t[0]}|${t[1]}`;
  startAnim(from);
  pending = null; hideChoice();
  if (hands[p].length === 0) return endHand('domino', p);
  if ([0, 1, 2, 3].every(q => legalMoves(q).length === 0)) return endHand('block', p);
  turn = (p + 1) % 4;
  step();
}

function doPass(p) {
  const [L, R] = ends();
  lacks[p].add(L); lacks[p].add(R);
  lastAct[p] = 'passed';
  sfxPass();
  turn = (p + 1) % 4;
  step();
}

function step() {
  if (phase !== 'play') return;
  const moves = legalMoves(turn);
  render();
  if (turn === 0) {
    if (!moves.length) {
      setStatus('No tile of yours fits — you pass.');
      later(() => doPass(0), 1400);
    } else if (!board && mustLead66) {
      setStatus('You hold the double six — click it to open the game.');
    } else if (!board) {
      setStatus('Your lead — play any tile.');
    } else {
      setStatus('Your turn — click a highlighted tile.');
    }
    return;
  }
  setStatus(`${NAMES[turn]}${turn === 2 ? ' (your partner)' : ''} is thinking…`);
  later(() => {
    const m = botChoose(turn);
    if (m) doPlay(turn, m.t, m.side); else doPass(turn);
  }, BOT_DELAY);
}

function endHand(kind, p) {
  gen++;
  phase = 'over';
  revealed = true;
  const pp = [0, 1, 2, 3].map(pipsOf);
  const total = pp.reduce((a, b) => a + b, 0);
  let html = '', win = -1;
  if (kind === 'domino') {
    win = p % 2;
    nextLeader = p;
    html += `<h2>${p === 0 ? 'You dominoed!' : NAMES[p] + ' dominoed!'}</h2>`;
  } else {
    const tp = [pp[0] + pp[2], pp[1] + pp[3]];
    html += `<h2>The game is blocked (tranque)!</h2>
             <p>Team pips — ${TEAM_NAMES[0]}: <b>${tp[0]}</b> &nbsp; ${TEAM_NAMES[1]}: <b>${tp[1]}</b></p>`;
    if (tp[0] !== tp[1]) {
      win = tp[0] < tp[1] ? 0 : 1;
      nextLeader = pp[win] <= pp[win + 2] ? win : win + 2;
    } else {
      html += '<p>Tie — no points this hand.</p>';
      nextLeader = handLeader;
    }
  }
  if (win >= 0) {
    scores[win] += total;
    html += `<p><b>${TEAM_NAMES[win]}</b> score <b>${total}</b> points (all pips left in every hand).</p>`;
  }
  html += '<table>' + [0, 1, 2, 3].map(q =>
    `<tr><td style="text-align:left">${NAMES[q]}${q === 2 ? ' (partner)' : ''}</td><td>${hands[q].length} tiles</td><td>${pp[q]} pips</td></tr>`).join('') + '</table>';
  html += `<p style="font-size:18px">${TEAM_NAMES[0]} <b>${scores[0]}</b> — ${TEAM_NAMES[1]} <b>${scores[1]}</b> &nbsp;(to ${TARGET})</p>`;
  if (scores[0] >= TARGET || scores[1] >= TARGET) {
    phase = 'matchover';
    html += scores[0] >= TARGET
      ? '<h2>🎉 You and North win the match!</h2>'
      : '<h2>East & West win the match.</h2>';
    html += '<button onclick="newMatch()">New match</button>';
  } else {
    html += `<p>${NAMES[nextLeader] === 'You' ? 'You lead' : NAMES[nextLeader] + ' leads'} the next hand.</p>`;
    html += '<button onclick="newHand()">Next hand</button>';
  }
  html += '<button onclick="hideOverlay()">View table</button>';
  updateHeader();
  setStatus(kind === 'domino' ? `${NAMES[p] === 'You' ? 'You' : NAMES[p]} dominoed!` : 'Blocked game!');
  render();
  lastResultHtml = html;
  setTimeout(() => { if (!menuOpen) showOverlay(html); }, 1000);
}

// ===================== BOT AI =====================
function botChoose(p) {
  const moves = legalMoves(p);
  if (!moves.length) return null;
  if (moves.length === 1) return moves[0];
  const partner = (p + 2) % 4, opps = [(p + 1) % 4, (p + 3) % 4];
  const onBoard = boardTiles();
  let best = null, bestScore = -Infinity;

  for (const m of moves) {
    const t = m.t;
    let s = t[0] + t[1];                      // dump heavy tiles
    if (t[0] === t[1]) s += 7;                // doubles are hard to place later
    let ne;
    if (m.side === 'C') ne = [t[0], t[1]];
    else {
      const [L, R] = ends();
      const e = m.side === 'L' ? L : R;
      const outer = t[0] === e ? t[1] : t[0];
      ne = m.side === 'L' ? [outer, R] : [L, outer];
    }
    const rest = hands[p].filter(x => x !== t);
    const follow = rest.filter(x => has(x, ne[0]) || has(x, ne[1])).length;
    s += follow * 3;                          // keep being able to play next turn
    if (follow === 0 && rest.length) s -= 6;

    for (const n of new Set(ne)) {
      for (const o of opps) if (lacks[o].has(n)) s += 5;       // opponents can't follow this number
      if (lacks[partner].has(n)) s -= 4;                        // don't starve partner
      if (hands[partner].length === 1 && lacks[partner].has(n)) s -= 4;
      // Control: if every remaining tile of number n is in my hand, the end is mine
      const seen = onBoard.filter(x => has(x, n)).length + (has(t, n) ? 1 : 0) + rest.filter(x => has(x, n)).length;
      const myN = rest.filter(x => has(x, n)).length;
      if (seen >= 7 && myN > 0) s += 4;
    }
    // Opponent about to domino: favour ends they are known to lack
    for (const o of opps) if (hands[o].length <= 2 && ne.every(n => lacks[o].has(n))) s += 10;

    s += Math.random() * 0.8;
    if (s > bestScore) { bestScore = s; best = m; }
  }
  return best;
}

// ===================== HUMAN INPUT =====================
function onHumanTile(i) {
  const t = hands[0][i];
  const ms = legalMoves(0).filter(m => m.t === t);
  if (!ms.length) { setStatus("That tile doesn't fit on either end."); return; }
  if (ms.length === 1) { doPlay(0, t, ms[0].side); return; }
  const [L, R] = ends();
  if (L === R) { doPlay(0, t, board.left.length <= board.right.length ? 'L' : 'R'); return; }
  pending = t;
  showChoice(L, R);
  render();
}

function showChoice(L, R) {
  const c = document.getElementById('choice');
  document.getElementById('chooseL').textContent = `◀ Left end (${L})`;
  document.getElementById('chooseR').textContent = `Right end (${R}) ▶`;
  document.getElementById('chooseL').onclick = () => { if (pending && phase === 'play' && turn === 0) doPlay(0, pending, 'L'); };
  document.getElementById('chooseR').onclick = () => { if (pending && phase === 'play' && turn === 0) doPlay(0, pending, 'R'); };
  c.style.display = 'block';
}
function hideChoice() { document.getElementById('choice').style.display = 'none'; }
function cancelChoice() { pending = null; hideChoice(); render(); }

function canvasPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hitHand(x, y) {
  // generous hit boxes so tiles are easy to tap with a finger
  for (const h of handHits) if (x >= h.x - h.px && x <= h.x + h.w + h.px && y >= h.y - 10 && y <= h.y + h.h + 10) return h.i;
  return -1;
}
cv.addEventListener('click', e => {
  if (phase !== 'play' || turn !== 0) return;
  const [x, y] = canvasPos(e);
  const i = hitHand(x, y);
  if (i >= 0) onHumanTile(i);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;   // no hover effect on touch screens
  const [x, y] = canvasPos(e);
  const i = (phase === 'play' && turn === 0) ? hitHand(x, y) : -1;
  cv.style.cursor = i >= 0 ? 'pointer' : 'default';
  if (i !== hoverIdx) { hoverIdx = i; render(); }
});

// ===================== RENDERING =====================
const PIPS = {
  0: [], 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]],
  4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
  6: [[0, 0], [0, 1], [0, 2], [2, 0], [2, 1], [2, 2]]
};

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPips(n, x, y, w, h, horiz) {
  const rad = Math.min(w, h) * 0.1;
  ctx.fillStyle = '#1b1b1b';
  for (const [i, j] of PIPS[n]) {
    const cx = horiz ? x + w * (0.22 + 0.28 * j) : x + w * (0.22 + 0.28 * i);
    const cy = horiz ? y + h * (0.22 + 0.28 * i) : y + h * (0.22 + 0.28 * j);
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
  }
}

// a = left/top value, b = right/bottom value
function drawTile(x, y, w, h, a, b, opt = {}) {
  const pad = Math.max(1, Math.min(w, h) * 0.05);
  x += pad; y += pad; w -= 2 * pad; h -= 2 * pad;
  const r = Math.min(w, h) * 0.16;
  // shadow
  rr(x + 2, y + 2, w, h, r); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
  rr(x, y, w, h, r);
  if (opt.back) {
    ctx.fillStyle = '#8a2432'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#3a0d14'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,220,150,.5)';
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.18, 0, Math.PI * 2); ctx.fill();
    return;
  }
  ctx.fillStyle = opt.dim ? '#bdb6a3' : '#f7f1e1'; ctx.fill();
  ctx.lineWidth = opt.hl ? 3 : 1.2;
  ctx.strokeStyle = opt.hl || '#333'; ctx.stroke();
  const horiz = w >= h;
  ctx.strokeStyle = '#666'; ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.04);
  ctx.beginPath();
  if (horiz) { ctx.moveTo(x + w / 2, y + h * 0.15); ctx.lineTo(x + w / 2, y + h * 0.85); }
  else { ctx.moveTo(x + w * 0.15, y + h / 2); ctx.lineTo(x + w * 0.85, y + h / 2); }
  ctx.stroke();
  if (horiz) { drawPips(a, x, y, w / 2, h, true); drawPips(b, x + w / 2, y, w / 2, h, true); }
  else { drawPips(a, x, y, w, h / 2, false); drawPips(b, x, y + h / 2, w, h / 2, false); }
}

// Lay out one arm of the chain as a snake. Units: tile short side = 1, long side = 2.
function layArm(arm, hx, hy, dx, vs, hp, out, LIM) {
  for (const en of arm) {
    const { inner, outer } = en;
    const dbl = inner === outer;
    const need = dbl ? 1 : 2;
    const last = en === lastPlaced;
    if ((dx > 0 && hx + need > LIM) || (dx < 0 && hx - need < -LIM)) {
      // corner: one vertical tile, then reverse direction
      const x = dx > 0 ? hx - 1 : hx;
      const y = vs > 0 ? hy + hp : hy - hp - 2;
      out.push({ x, y, w: 1, h: 2, a: vs > 0 ? inner : outer, b: vs > 0 ? outer : inner, last });
      hy = vs > 0 ? hy + hp + 1.5 : hy - hp - 1.5;
      hx = dx > 0 ? hx - 1 : hx + 1;
      dx = -dx; hp = 0.5;
    } else if (dbl) {
      out.push({ x: dx > 0 ? hx : hx - 1, y: hy - 1, w: 1, h: 2, a: inner, b: inner, last });
      hx += dx; hp = 1;
    } else {
      out.push({ x: dx > 0 ? hx : hx - 2, y: hy - 0.5, w: 2, h: 1, a: dx > 0 ? inner : outer, b: dx > 0 ? outer : inner, last });
      hx += 2 * dx; hp = 0.5;
    }
  }
}

function layoutBoard(LIM) {
  const pieces = [];
  const c = board.center;
  let rx, lx, hp;
  if (c.a === c.b) { pieces.push({ x: -0.5, y: -1, w: 1, h: 2, a: c.a, b: c.b, last: c === lastPlaced }); rx = 0.5; lx = -0.5; hp = 1; }
  else { pieces.push({ x: -1, y: -0.5, w: 2, h: 1, a: c.a, b: c.b, last: c === lastPlaced }); rx = 1; lx = -1; hp = 0.5; }
  layArm(board.right, rx, 0, 1, 1, hp, pieces, LIM);
  layArm(board.left, lx, 0, -1, -1, hp, pieces, LIM);
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const p of pieces) { minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x + p.w); maxy = Math.max(maxy, p.y + p.h); }
  return { pieces, minx, miny, maxx, maxy };
}

function drawBoard(bx, by, bw, bh) {
  ctx.fillStyle = '#0d6634';
  rr(bx, by, bw, bh, 18); ctx.fill();
  ctx.strokeStyle = '#3d2410'; ctx.lineWidth = 6; ctx.stroke();
  if (!board) {
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '18px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(phase === 'play' ? 'Waiting for the first tile…' : '', bx + bw / 2, by + bh / 2);
    return;
  }
  const top = 22, m = 16;                    // leave room for the "Open ends" label
  const aw = bw - m, ah = bh - top - m;
  let best = null;
  for (let LIM = 16; LIM >= 4; LIM--) {       // try snake widths, keep the one with the largest tiles
    const L = layoutBoard(LIM);
    const sc = Math.min(aw / (L.maxx - L.minx), ah / (L.maxy - L.miny), 40);
    if (!best || sc > best.s + 0.01) best = { ...L, s: sc };
  }
  const { pieces, minx, maxx, miny, maxy, s } = best;
  const ox = bx + bw / 2 - (minx + maxx) / 2 * s;
  const oy = by + top + (bh - top) / 2 - (miny + maxy) / 2 * s;
  let moving = null;
  for (const p of pieces) {
    if (p.last && anim) { moving = p; continue; }
    drawTile(ox + p.x * s, oy + p.y * s, p.w * s, p.h * s, p.a, p.b, { hl: p.last ? '#ffcc33' : null });
  }
  if (moving) {
    const k = Math.min(1, (performance.now() - anim.start) / ANIM_MS), e = 1 - Math.pow(1 - k, 3);
    const w = moving.w * s, h = moving.h * s, tx = ox + moving.x * s, ty = oy + moving.y * s;
    const fx = anim.from.x - w / 2, fy = anim.from.y - h / 2;
    drawTile(fx + (tx - fx) * e, fy + (ty - fy) * e, w, h, moving.a, moving.b, { hl: '#ffcc33' });
  }
  // end labels
  const [L, R] = ends();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '14px system-ui'; ctx.textAlign = 'left';
  ctx.fillText(`Open ends: ${L} and ${R}`, bx + 14, by + 20);
}

function drawLabel(text, sub, x, y, active, small) {
  ctx.textAlign = 'center';
  ctx.font = `bold ${small ? 13 : 15}px system-ui`;
  ctx.fillStyle = active ? '#ffd35c' : '#fff';
  ctx.fillText((active ? '▶ ' : '') + text, x, y);
  if (sub) { ctx.font = `${small ? 12 : 13}px system-ui`; ctx.fillStyle = sub === 'passed' ? '#ff9b9b' : '#cfe8d6'; ctx.fillText(sub, x, y + (small ? 15 : 17)); }
}

// Desktop: opponents around the table. Phone / small window: opponents in a strip on top.
function getLayout() {
  const compact = W < 760 || H < 560;
  if (!compact) {
    const handH = 140, sideW = Math.min(130, W * 0.14), topH = 105;
    return { compact, handH, sideW, topH, tw: 44, gap: 8 };
  }
  const gap = 6;
  const tw = Math.max(24, Math.min(52, (W - 16) / 7 - gap, H * (W > H ? 0.09 : 0.11)));
  return { compact, handH: tw * 2 + 58, sideW: 6, topH: 74, tw, gap };
}

function render() {
  ctx.fillStyle = '#0b3d20'; ctx.fillRect(0, 0, W, H);
  const Lo = getLayout();
  const { handH, sideW, topH, compact } = Lo;
  document.getElementById('choice').style.bottom = `calc(${handH + 6}px + env(safe-area-inset-bottom))`;
  drawBoard(sideW, topH, W - 2 * sideW, H - topH - handH);
  if (phase === 'start') return;
  const active = q => phase === 'play' && turn === q;

  if (compact) {
    // West | North | East across the top, in seating order
    const colW = W / 3;
    [[3, 'West'], [2, 'North (partner)'], [1, 'East']].forEach(([q, name], k) => {
      const cx = colW * k + colW / 2;
      drawLabel(name, lastAct[q], cx, 16, active(q), true);
      const n = hands[q].length;
      const tw = revealed ? Math.min(16, (colW - 8) / Math.max(n, 1) - 2) : Math.min(10, (colW - 8) / Math.max(n, 1) - 2);
      const th = tw * 2, g = 2, total = n * (tw + g) - g, x0 = cx - total / 2;
      for (let i = 0; i < n; i++) { const t = hands[q][i]; drawTile(x0 + i * (tw + g), 38, tw, th, t[0], t[1], { back: !revealed }); }
    });
  } else {
    // North (partner) – top
    const n = hands[2].length, tw = revealed ? 22 : 18, th = tw * 2, gap = 4;
    const total = n * (tw + gap) - gap, x0 = W / 2 - total / 2;
    for (let i = 0; i < n; i++) { const t = hands[2][i]; drawTile(x0 + i * (tw + gap), 44, tw, th, t[0], t[1], { back: !revealed }); }
    drawLabel('North — partner', lastAct[2], W / 2, 20, active(2));
    // East – right, West – left (tiles horizontal, stacked)
    for (const [q, cx] of [[1, W - sideW / 2], [3, sideW / 2]]) {
      const n = hands[q].length, th = revealed ? 22 : 18, tw = th * 2, gap = 4;
      const total = n * (th + gap) - gap, y0 = topH + (H - topH - handH) / 2 - total / 2 + 10;
      for (let i = 0; i < n; i++) { const t = hands[q][i]; drawTile(cx - tw / 2, y0 + i * (th + gap), tw, th, t[0], t[1], { back: !revealed }); }
      drawLabel(NAMES[q], lastAct[q], cx, y0 - 30, active(q));
    }
  }

  // Human hand – bottom
  handHits = [];
  const myMoves = (phase === 'play' && turn === 0) ? legalMoves(0) : [];
  const n = hands[0].length;
  const gap = Lo.gap, tw = Math.min(Lo.tw, (W - 16) / Math.max(n, 1) - gap), th = tw * 2;
  const total = n * (tw + gap) - gap, x0 = W / 2 - total / 2;
  const y0 = compact ? H - th - 8 : H - handH + 50;
  for (let i = 0; i < n; i++) {
    const t = hands[0][i];
    const ok = myMoves.some(m => m.t === t);
    const lift = (ok ? 10 : 0) + (i === hoverIdx && ok ? 4 : 0);
    const x = x0 + i * (tw + gap), y = y0 - lift;
    drawTile(x, y, tw, th, t[0], t[1], { hl: t === pending ? '#ff6a00' : ok ? '#7dff8a' : null, dim: myMoves.length > 0 && !ok });
    handHits.push({ i, x, y, w: tw, h: th, px: gap / 2 });
  }
  drawLabel('You', lastAct[0], W / 2, H - handH + 16, active(0), compact);
}

// ===================== UI HELPERS =====================
function setStatus(s) { document.getElementById('status').textContent = s; }
function updateHeader() {
  document.getElementById('scores').innerHTML =
    `<span class="long">${TEAM_NAMES[0]}</span><span class="short">Us</span>: <b>${scores[0]}</b> &nbsp;|&nbsp; ` +
    `<span class="long">${TEAM_NAMES[1]}</span><span class="short">Them</span>: <b>${scores[1]}</b> &nbsp;` +
    `<span style="opacity:.6">(to ${TARGET}${handNo ? '<span class="long">, hand ' + handNo + '</span>' : ''})</span>`;
}
function showOverlay(html) { document.getElementById('panel').innerHTML = html; document.getElementById('overlay').style.display = 'flex'; }
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
  if (phase === 'over' || phase === 'matchover') {
    setStatus(phase === 'over' ? 'Hand over — ' : 'Match over — ');
    const st = document.getElementById('status');
    const b = document.createElement('button');
    b.textContent = phase === 'over' ? 'Next hand' : 'New match';
    b.style.cssText = 'font-size:13px;padding:4px 12px;margin:0 0 0 6px';
    b.onclick = phase === 'over' ? newHand : newMatch;
    st.appendChild(b);
  }
}

const RULES_HTML = `
  <ul>
    <li>Double-six set: 28 tiles, each of the 4 players gets 7. No boneyard.</li>
    <li>You and <b>North</b> (across from you) are partners against <b>East</b> and <b>West</b>.</li>
    <li>First hand: whoever holds the <b>6|6</b> must open with it. After that, the winner of the previous hand leads with any tile.</li>
    <li>Play goes counter-clockwise (You → East → North → West). Match a number on either open end. If you can play, you must; otherwise you pass.</li>
    <li><b>Domino:</b> the player who plays their last tile wins the hand. Their team scores the pips left in <i>all</i> hands.</li>
    <li><b>Blocked (tranque):</b> if no one can play, the team with fewer pips left scores all the pips. A tie scores nothing.</li>
    <li>First team to <b>${TARGET}</b> points wins the match.</li>
  </ul>`;

let menuOpen = false;

function pauseGame() { menuOpen = true; if (phase === 'play') paused = true; }
function resumeGame() {
  menuOpen = false;
  if (phase === 'over' || phase === 'matchover') { showOverlay(lastResultHtml); return; }
  hideOverlay();
  paused = false;
  if (resumeFn) { const f = resumeFn; resumeFn = null; f(); }
}

function showMenu() {
  pauseGame();
  const inGame = phase !== 'start';
  showOverlay(`<div class="menu">
    <h1>🁫 DominEA</h1>
    <p class="sub">4-player partner game · first team to ${TARGET}</p>
    ${inGame ? '<button onclick="resumeGame()">Resume</button>' : ''}
    <button onclick="menuPlay()">${inGame ? 'New game' : 'Play'}</button>
    <button onclick="showSettings()">Settings</button>
    <button onclick="showRules()">Rules</button>
    <p class="credits">Made by Eduardo Aguirre</p>
  </div>`);
}

function menuPlay() {
  audio();   // unlock sound on phones (needs a tap)
  if (phase !== 'start' && phase !== 'matchover' && !confirm('Abandon this match and start a new one?')) return;
  menuOpen = false;
  newMatch();
}

function showSettings() {
  pauseGame();
  showOverlay(`<div class="menu">
    <h2>Settings</h2>
    <div class="setting"><span>Sound effects</span>
      <button id="soundBtn" class="${settings.sound ? '' : 'off'}" onclick="toggleSound()">${settings.sound ? 'On' : 'Off'}</button></div>
    <button onclick="showMenu()">Back</button>
  </div>`);
}

function toggleSound() {
  settings.sound = !settings.sound;
  saveSettings();
  const b = document.getElementById('soundBtn');
  b.textContent = settings.sound ? 'On' : 'Off';
  b.className = settings.sound ? '' : 'off';
  if (settings.sound) { audio(); sfxClack(); }   // quick preview
}

function showRules() {
  pauseGame();
  showOverlay('<h2>Rules</h2>' + RULES_HTML +
    (phase === 'start' ? '<button onclick="showMenu()">Back</button>' : '<button onclick="resumeGame()">Close</button>'));
}
function confirmNewMatch() { menuPlay(); }

const wrap = document.getElementById('wrap');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
updateHeader();
setStatus('Welcome!');
showMenu();

// Offline support (only works when served over https:// or http://localhost, not when opened as a file)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err)));
}
</script>
